<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:560px;
  border-radius:20px;
  overflow:hidden;
  background:black;
}

/* BG */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 🔥 MIRROR FIX (SELFIE MODE) */
#video{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%) scaleX(-1);
  width:240px;
  height:240px;
  border-radius:15px;
  object-fit:cover;
  z-index:2;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:9999;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
}

/* PHOTO */
.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKER */
.sticker{
  position:absolute;
  width:45px;
  z-index:9999;
  touch-action:none;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button onclick="startBooth()">CLICK 📸</button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div>
<img src="2.jpg" width="40" onclick="addSticker(this.src)">
<img src="3.png" width="40" onclick="addSticker(this.src)">
<img src="4.png" width="40" onclick="addSticker(this.src)">
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
  video.srcObject=stream;
});

/* TIMER */
async function timer(){
  for(let t of ["Ready...","Set...","Paws 🐾"]){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* 🔥 CLICK FIX (SAFE CAPTURE) */
function capture(){

  if(!video.videoWidth) return;

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");

  // mirror fix for final image (IMPORTANT)
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);

  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG */
function drag(el){
  let drag=false,x=0,y=0;

  el.addEventListener("mousedown",e=>{
    drag=true;
    x=e.offsetX;
    y=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!drag) return;
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(e.clientX-p.left-x)+"px";
    el.style.top=(e.clientY-p.top-y)+"px";
  });

  document.addEventListener("mouseup",()=>drag=false);
}

/* DOWNLOAD */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height=1920;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  let y=50;

  photos.forEach(p=>{
    const img=p.querySelector("img");
    ctx.drawImage(img,100,y,880,600);
    y+=620;
  });

  const a=document.createElement("a");
  a.download="meowcam.png";
  a.href=c.toDataURL("image/png");
  a.click();
}

</script>

</body>
</html>
