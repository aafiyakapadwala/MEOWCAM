<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:auto;
}

/* LAYOUT */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:340px;
  height:600px;
  border-radius:20px;
  overflow:hidden;
}

/* BACKGROUND */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SELFIE PREVIEW (MIRRORED ONLY VIEW) */
#video{
  position:absolute;
  top:150px;
  left:50%;
  transform:translateX(-50%) scaleX(-1);
  width:250px;
  height:270px;
  border-radius:18px;
  object-fit:cover;
}

/* BUTTON (YOUR ORIGINAL STYLE) */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:230px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:50px;
  color:#ff2e6d;
  font-weight:bold;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* STRIP */
#strip{
  background:white;
  width:260px;
  min-height:300px;
  padding:10px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO */
.photo{
  position:relative;
  width:240px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKER FIX */
.sticker{
  position:absolute;
  width:45px;
  z-index:9999;
  touch-action:none;
  user-select:none;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
}

/* MOBILE */
@media(max-width:768px){
  .wrapper{
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE (FIXED NO MIRROR IN OUTPUT) */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");

  // REMOVE MIRROR FOR FINAL IMAGE
  ctx.setTransform(1,0,0,1,0,0);

  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH (AUTO RESET AFTER 3 SHOTS) */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKERS */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="50px";
  s.style.top="50px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG FIX (MOBILE + PC PERFECT) */
function drag(el){

  let dragging=false,ox=0,oy=0;

  const start=(e)=>{
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-el.offsetLeft;
    oy=p.clientY-el.offsetTop;
  };

  const move=(e)=>{
    if(!dragging) return;

    const p=e.touches?e.touches[0]:e;
    const box=el.parentElement.getBoundingClientRect();

    el.style.left=(p.clientX-box.left-ox)+"px";
    el.style.top=(p.clientY-box.top-oy)+"px";

    e.preventDefault();
  };

  const end=()=>dragging=false;

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start);

  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});

  document.addEventListener("mouseup",end);
  document.addEventListener("touchend",end);
}

/* DOWNLOAD HD 1080x1920 */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height=1920;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  let y=50;
  const scale=4.5;

  photos.forEach(p=>{

    const img=p.querySelector("img");

    ctx.drawImage(img, 200, y, 680, 520);

    y+=600;
  });

  const a=document.createElement("a");
  a.download="meowcam_v2.png";
  a.href=c.toDataURL("image/png");

  a.click();
}

</script>

</body>
</html>
