<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:auto;
}

/* LAYOUT */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:560px;
  border-radius:20px;
  overflow:hidden;
}

/* VIDEO */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:85px;
  height:85px;
  border:none;
  border-radius:50%;
  background:#ff8fab;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:100;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* GLITTER OVERLAY */
.glitter{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.glitter.active{
  animation:glow 0.6s ease;
}
@keyframes glow{
  0%{opacity:0;}
  30%{opacity:1;}
  100%{opacity:0;}
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:240px;
  min-height:250px;
  overflow:auto;
}

/* PHOTO */
.photo{
  position:relative;
  width:220px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKERS */
.sticker{
  position:absolute;
  width:45px;
  z-index:9999;
  touch-action:none;
  user-select:none;
}

/* PANEL */
.side{text-align:center;}

.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<!-- ✨ GLITTER -->
<div class="glitter" id="glitter">✨✨✨✨✨</div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<!-- SOUND -->
<audio id="shutter" src="https://www.soundjay.com/mechanical/camera-shutter-click-01.mp3"></audio>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");
const glitter=document.getElementById("glitter");
const sound=document.getElementById("shutter");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* EFFECTS */
function effects(){
  flash.classList.add("active");
  glitter.classList.add("active");
  sound.play();

  setTimeout(()=>{
    flash.classList.remove("active");
    glitter.classList.remove("active");
  },600);
}

/* CAPTURE */
function capture(){

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  effects();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKERS */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG */
function drag(el){
  let drag=false,ox=0,oy=0;

  el.onmousedown=e=>{
    drag=true;
    ox=e.offsetX;
    oy=e.offsetY;
  };

  document.onmousemove=e=>{
    if(!drag) return;
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(e.clientX-p.left-ox)+"px";
    el.style.top=(e.clientY-p.top-oy)+"px";
  };

  document.onmouseup=()=>drag=false;
}

/* DOWNLOAD 1080x1920 */
function downloadStrip(){

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height=1920;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  const photos=document.querySelectorAll(".photo");

  let y=50;

  photos.forEach(p=>{
    const img=p.querySelector("img");
    ctx.drawImage(img,200,y,680,500);

    y+=600;
  });

  const a=document.createElement("a");
  a.download="meowcam_final.png";
  a.href=c.toDataURL();
  a.click();
}

</script>

</body>
</html>
