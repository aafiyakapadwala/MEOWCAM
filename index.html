<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V3 🐱💖</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
}

/* CAMERA */
.camera-box{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
  object-fit:cover;
}

#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:#ff2e6d;
  font-weight:bold;
}

.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{animation:flash .3s;}
@keyframes flash{0%{opacity:1;}100%{opacity:0;}}

/* FILTERS */
.filters{
  margin-top:10px;
  display:flex;
  gap:5px;
  justify-content:center;
  flex-wrap:wrap;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* STICKERS */
.sticker-box{
  position:absolute;
  width:80px;
}

.handle{
  width:14px;
  height:14px;
  background:#ff4d88;
  position:absolute;
  right:0;
  bottom:0;
  border-radius:50%;
  cursor:nwse-resize;
}

.sticker-panel img{
  width:40px;
  cursor:pointer;
  margin:3px;
}

/* CREDIT */
.credit{
  font-size:12px;
  background:white;
  padding:6px;
  border-radius:10px;
  text-align:center;
  margin-top:10px;
}

/* PREVIEW MODAL */
.preview-box{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.preview-content{
  background:white;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

.preview-content img{
  width:250px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container-fluid py-3">
<div class="row justify-content-center">

<!-- CAMERA -->
<div class="col-lg-4 col-md-6 col-12 d-flex flex-column align-items-center">

<div class="camera-box">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" class="d-none"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

</div>

<!-- FILTERS -->
<div class="filters mt-2">
<button onclick="setFilter('none')" class="btn btn-sm btn-light">Normal</button>
<button onclick="setFilter('contrast(1.2)')" class="btn btn-sm btn-light">Bright</button>
<button onclick="setFilter('sepia(1)')" class="btn btn-sm btn-light">Vintage</button>
<button onclick="setFilter('grayscale(1)')" class="btn btn-sm btn-light">B&W</button>
<button onclick="setFilter('brightness(1.3)')" class="btn btn-sm btn-light">Glow</button>
</div>

<button class="btn btn-danger mt-2" onclick="startBooth()">CLICK 📸</button>

<!-- NEW DONE BUTTON -->
<button class="btn btn-success mt-2" onclick="finishStrip()">DONE ✔</button>

</div>

<!-- SIDE -->
<div class="col-lg-4 col-md-6 col-12 d-flex gap-2">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

</div>

</div>
</div>

<!-- PREVIEW MODAL -->
<div class="preview-box" id="previewBox">
  <div class="preview-content">
    <h5>✨ Your Strip Preview</h5>
    <img id="finalPreview">
    <br><br>
    <a id="downloadLink" class="btn btn-success">Download 💾</a>
    <br><br>
    <button class="btn btn-danger" onclick="closePreview()">Close</button>
  </div>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");

let currentPhoto=null;
let currentFilter="none";

navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const box=document.createElement("div");
  box.className="sticker-box";
  box.style.left="40px";
  box.style.top="40px";

  const img=document.createElement("img");
  img.src=src;
  img.style.width="100%";

  const handle=document.createElement("div");
  handle.className="handle";

  box.appendChild(img);
  box.appendChild(handle);
  currentPhoto.appendChild(box);

  drag(box);
  resize(box,handle);
}

/* DRAG */
function drag(el){
  let drag=false,ox=0,oy=0;

  el.onmousedown=e=>{
    drag=true;
    ox=e.clientX-el.offsetLeft;
    oy=e.clientY-el.offsetTop;
  };

  document.onmousemove=e=>{
    if(!drag) return;
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(e.clientX-p.left-ox)+"px";
    el.style.top=(e.clientY-p.top-oy)+"px";
  };

  document.onmouseup=()=>drag=false;
}

/* RESIZE */
function resize(box,handle){
  let resizing=false;

  handle.onmousedown=e=>{
    resizing=true;
    e.stopPropagation();
  };

  document.onmousemove=e=>{
    if(!resizing) return;
    box.style.width=(box.offsetWidth + e.movementX)+"px";
  };

  document.onmouseup=()=>resizing=false;
}

/* DONE → PREVIEW + DOWNLOAD */
function finishStrip(){
  const imgs=document.querySelectorAll(".photo img");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=300;
  c.height=imgs.length*300;

  imgs.forEach((img,i)=>{
    ctx.drawImage(img,0,i*300,300,300);
  });

  const final=c.toDataURL("image/png");

  document.getElementById("finalPreview").src=final;
  document.getElementById("downloadLink").href=final;
  document.getElementById("downloadLink").download="meowcam-strip.png";

  document.getElementById("previewBox").style.display="flex";
}

/* CLOSE */
function closePreview(){
  document.getElementById("previewBox").style.display="none";
}

</script>

</body>
</html>
