<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:560px;
  border-radius:20px;
  overflow:hidden;
}

.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  border-radius:15px;
  object-fit:cover;
}

/* CLICK */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:85px;
  height:85px;
  border:none;
  border-radius:50%;
  background:#ff8fab;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
}

/* PHOTO */
.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
  display:block;
}

/* STICKER */
.sticker{
  position:absolute;
  width:40px;
  z-index:999;
  touch-action:none;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:35px;
}

/* BUTTONS */
button{
  margin-top:8px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

canvas{
  max-width:100%;
}

/* MOBILE */
@media(max-width:768px){
  .wrapper{
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="done()">DONE ✔</button>
<button onclick="resetStrip()">RESET 🔄</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h3>💖 Your Strip</h3>
    <canvas id="finalCanvas"></canvas><br>
    <button onclick="downloadFinal()">DOWNLOAD 1080×270</button>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>

const video=document.getElementById("video");
const strip=document.getElementById("strip");
let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* CAPTURE */
function capture(){
  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=300;
  c.height=200;

  ctx.drawImage(video,0,0,300,200);

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=c.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* SIMPLE BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await new Promise(r=>setTimeout(r,700));
    capture();
  }
}

/* STICKERS */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG */
function drag(el){
  let dx=0,dy=0,drag=false;

  el.addEventListener("mousedown",e=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!drag) return;
    el.style.left=(e.pageX-dx)+"px";
    el.style.top=(e.pageY-dy)+"px";
  });

  document.addEventListener("mouseup",()=>drag=false);
}

/* RESET */
function resetStrip(){
  strip.innerHTML="";
  currentPhoto=null;
}

/* DONE → POPUP */
function done(){

  const photos=document.querySelectorAll(".photo");

  const c=document.getElementById("finalCanvas");
  const ctx=c.getContext("2d");

  // 🔥 FINAL SIZE 1080 x 270
  c.width=1080;
  c.height=270;

  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  let x=20;

  photos.forEach(p=>{
    const img=p.querySelector("img");

    ctx.drawImage(img,x,20,320,230);

    // stickers
    p.querySelectorAll(".sticker").forEach(st=>{
      const sx=parseInt(st.style.left)||0;
      const sy=parseInt(st.style.top)||0;

      const stickerImg=new Image();
      stickerImg.src=st.src;

      ctx.drawImage(stickerImg,x+sx,20+sy,40,40);
    });

    x+=350;
  });

  document.getElementById("popup").style.display="flex";
}

/* CLOSE */
function closePopup(){
  document.getElementById("popup").style.display="none";
}

/* DOWNLOAD */
function downloadFinal(){
  const c=document.getElementById("finalCanvas");
  const a=document.createElement("a");
  a.download="meowcam-1080x270.png";
  a.href=c.toDataURL("image/png");
  a.click();
}

</script>

</body>
</html>
