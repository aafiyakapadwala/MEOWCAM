<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V3 🐱💖</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
}

/* CAMERA BOX */
.camera-box{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

/* BACKGROUND */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA */
#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
  object-fit:cover;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:#ff2e6d;
  font-weight:bold;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* FILTERS */
.filters{
  margin-top:10px;
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO DROP ANIMATION */
.photo{
  width:200px;
  margin:10px auto;
  animation:drop .4s ease;
}

@keyframes drop{
  from{transform:translateY(-30px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

/* STICKER BOX */
.sticker-box{
  position:absolute;
  width:80px;
  cursor:move;
  transition:0.1s;
}

/* HANDLE */
.handle{
  width:14px;
  height:14px;
  background:#ff4d88;
  position:absolute;
  right:0;
  bottom:0;
  border-radius:50%;
  cursor:nwse-resize;
}

/* STICKERS PANEL */
.sticker-panel img{
  width:40px;
  cursor:pointer;
  margin:3px;
}

/* CREDIT */
.credit{
  font-size:12px;
  background:white;
  padding:6px;
  border-radius:10px;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container-fluid py-3">
<div class="row justify-content-center">

<!-- CAMERA -->
<div class="col-lg-4 col-md-6 col-12 d-flex flex-column align-items-center">

<div class="camera-box">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" class="d-none"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

</div>

<!-- FILTERS (FIXED BELOW CAMERA) -->
<div class="filters mt-2">
<button onclick="setFilter('none')" class="btn btn-sm btn-light">Normal</button>
<button onclick="setFilter('contrast(1.2)')" class="btn btn-sm btn-light">Bright</button>
<button onclick="setFilter('sepia(1)')" class="btn btn-sm btn-light">Vintage</button>
<button onclick="setFilter('grayscale(1)')" class="btn btn-sm btn-light">B&W</button>
<button onclick="setFilter('brightness(1.3)')" class="btn btn-sm btn-light">Glow</button>
</div>

<button class="btn btn-danger mt-2" onclick="startBooth()">CLICK 📸</button>

</div>

<!-- SIDE -->
<div class="col-lg-4 col-md-6 col-12 d-flex gap-2">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

</div>

</div>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const flash=document.getElementById("flash");
const countdown=document.getElementById("countdown");

let currentPhoto=null;
let currentFilter="none";

navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* TIMER */
async function timer(){
  for(let t of ["Ready...","Set...","Paws 🐾"]){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE + PRINT ANIMATION */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const box=document.createElement("div");
  box.className="sticker-box";
  box.style.left="40px";
  box.style.top="40px";

  const img=document.createElement("img");
  img.src=src;
  img.style.width="100%";

  const handle=document.createElement("div");
  handle.className="handle";

  box.appendChild(img);
  box.appendChild(handle);
  currentPhoto.appendChild(box);

  drag(box);
  resize(box,handle);
}

/* DRAG */
function drag(el){
  let drag=false,ox=0,oy=0;

  el.onmousedown=e=>{
    drag=true;
    ox=e.clientX-el.offsetLeft;
    oy=e.clientY-el.offsetTop;
  };

  document.onmousemove=e=>{
    if(!drag) return;
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(e.clientX-p.left-ox)+"px";
    el.style.top=(e.clientY-p.top-oy)+"px";
  };

  document.onmouseup=()=>drag=false;
}

/* RESIZE */
function resize(box,handle){
  let resizing=false;

  handle.onmousedown=e=>{
    resizing=true;
    e.stopPropagation();
  };

  document.onmousemove=e=>{
    if(!resizing) return;
    box.style.width=(box.offsetWidth + e.movementX)+"px";
  };

  document.onmouseup=()=>resizing=false;
}

</script>

</body>
</html>
