<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:Comic Sans MS;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* WRAPPER */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:560px;
  border-radius:20px;
  overflow:hidden;
  background:black;
}

#video{
  position:absolute;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  object-fit:cover;
  border-radius:15px;
}

/* BUTTON (ONLY ONE) */
.start-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:10;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* FILTERS */
.filters{
  position:absolute;
  top:10px;
  left:10px;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  z-index:10;
}

.filters button{
  font-size:10px;
  padding:4px;
}

/* STRIP */
#strip{
  width:250px;
  background:white;
  padding:10px;
  border-radius:15px;
  min-height:250px;
}

.photo img{
  width:100%;
}

/* STICKERS */
.sticker{
  position:absolute;
  width:40px;
  z-index:999;
  touch-action:none;
}

/* STICKER PANEL */
.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* GLITTER */
.glitter{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,0.8),transparent);
  animation:glow .5s;
}
@keyframes glow{
  0%{opacity:0;}
  50%{opacity:1;}
  100%{opacity:0;}
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<div class="filters">
<button onclick="setFilter('none')">N</button>
<button onclick="setFilter('brightness(1.3)')">B</button>
<button onclick="setFilter('contrast(1.4)')">V</button>
<button onclick="setFilter('sepia(1)')">S</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="start-btn" onclick="startBooth()">START 📸</button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;
let filter="none";

/* CAMERA FIXED */
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
  video.srcObject=stream;
});

/* FILTER */
function setFilter(f){
  filter=f;
  video.style.filter=f;
}

/* TIMER */
async function timer(){
  for(let t of ["Ready","Set","Paws 🐾"]){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,600));
  }
  countdown.innerText="";
}

/* FLASH + GLITTER */
function flashFx(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);

  const g=document.createElement("div");
  g.className="glitter";
  document.body.appendChild(g);
  setTimeout(()=>g.remove(),500);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.filter=filter;
  ctx.drawImage(video,0,0);

  flashFx();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL("image/png");

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG FIX */
function drag(el){

  let d=false,x=0,y=0;

  el.addEventListener("mousedown",e=>{
    d=true;
    x=e.offsetX;
    y=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!d) return;
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(e.clientX-p.left-x)+"px";
    el.style.top=(e.clientY-p.top-y)+"px";
  });

  document.addEventListener("mouseup",()=>d=false);

  el.addEventListener("touchstart",e=>{
    d=true;
    const t=e.touches[0];
    x=t.clientX-el.offsetLeft;
    y=t.clientY-el.offsetTop;
  });

  document.addEventListener("touchmove",e=>{
    if(!d) return;
    const t=e.touches[0];
    const p=el.parentElement.getBoundingClientRect();
    el.style.left=(t.clientX-p.left-x)+"px";
    el.style.top=(t.clientY-p.top-y)+"px";
  });

  document.addEventListener("touchend",()=>d=false);
}

/* DOWNLOAD 1080x1920 */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height=1920;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  let y=60;

  photos.forEach(p=>{

    const img=p.querySelector("img");

    ctx.drawImage(img,100,y,880,600);

    p.querySelectorAll(".sticker").forEach(s=>{
      ctx.drawImage(
        s,
        100 + s.offsetLeft*3,
        y + s.offsetTop*3,
        s.width*3,
        s.height*3
      );
    });

    y+=620;
  });

  const a=document.createElement("a");
  a.download="meowcam.png";
  a.href=c.toDataURL("image/png");
  a.click();
}

</script>

</body>
</html>
