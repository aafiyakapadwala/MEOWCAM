<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* WRAPPER */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
}

/* CAMERA */
.container{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

/* BG */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA */
#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{animation:flash .3s;}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* SIDE */
.side{
  display:flex;
  flex-direction:row;
  gap:10px;
  align-items:flex-start;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  height:400px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* STICKERS */
.sticker-panel{
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:6px;
  width:90px;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* PHOTO */
.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKER */
.sticker{
  position:absolute;
  width:55px;
  z-index:9999;
  touch-action:none;
  user-select:none;
}

/* ✅ FIXED FILTERS (VISIBLE ALWAYS NOW) */
.filters{
  width:290px;
  margin:10px auto 0 auto;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  background:rgba(255,255,255,0.85);
  padding:8px;
  border-radius:12px;
}

/* BUTTON */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* CREDIT */
.credit{
  margin-top:10px;
  font-size:12px;
  background:white;
  padding:8px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div>
  <div id="strip"></div>

  <!-- FILTERS NOW BELOW STRIP (VISIBLE ON ALL DEVICES) -->
  <div class="filters">
    <button onclick="setFilter('none')">Normal</button>
    <button onclick="setFilter('contrast(1.2)')">Bright</button>
    <button onclick="setFilter('sepia(1)')">Vintage</button>
    <button onclick="setFilter('grayscale(1)')">B&W</button>
    <button onclick="setFilter('brightness(1.3)')">Glow</button>
  </div>

  <div class="credit">By <b>Aafiya Kapadwala</b></div>
</div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;
let currentFilter="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKER DRAG FIX */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

function drag(el){
  let dragging=false,ox=0,oy=0;

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start);

  function start(e){
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-el.offsetLeft;
    oy=p.clientY-el.offsetTop;
  }

  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});

  function move(e){
    if(!dragging) return;

    const p=e.touches?e.touches[0]:e;
    const box=el.parentElement.getBoundingClientRect();

    el.style.left=(p.clientX-box.left-ox)+"px";
    el.style.top=(p.clientY-box.top-oy)+"px";
  }

  document.addEventListener("mouseup",()=>dragging=false);
  document.addEventListener("touchend",()=>dragging=false);
}

</script>

</body>
</html>
