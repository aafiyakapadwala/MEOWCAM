<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:auto;
}

.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* SIDE */
.side{
  display:flex;
  flex-direction:row;
  gap:10px;
  align-items:flex-start;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* STICKERS */
.sticker-panel{
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:6px;
  width:90px;
  align-items:center;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

.sticker{
  position:absolute;
  width:55px;
  z-index:9999;
  cursor:move;
}

/* FILTERS (FIXED VISIBILITY ONLY) */
.filters{
  position:absolute;
  bottom:120px;   /* FIX: was missing visibility on phone */
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  z-index:999;
}

.filters button{
  padding:5px 8px;
  border:none;
  border-radius:8px;
  background:#ff8fab;
  color:white;
  font-size:10px;
  cursor:pointer;
}

/* FLASH FIX */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
}

.flash.active{
  animation:flash .3s;
}

@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* COUNTDOWN FIX */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:1000;
}

/* BUTTON */
button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
  margin-top:8px;
}

/* POPUP */
#popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  display:none;
  z-index:99999;
  text-align:center;
}

#popup img{
  width:250px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

<!-- FILTERS (NOW WORKING) -->
<div class="filters">
<button onclick="setFilter('none')">Normal</button>
<button onclick="setFilter('contrast(1.2)')">Bright</button>
<button onclick="setFilter('sepia(1)')">Vintage</button>
<button onclick="setFilter('grayscale(1)')">B&W</button>
<button onclick="setFilter('brightness(1.3)')">Glow</button>
</div>

</div>

<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="done()">DONE ✔</button>

</div>

</div>

<!-- POPUP -->
<div id="popup">
  <h3>Strip Ready 💖</h3>
  <img id="finalImg">
  <br><br>
  <button onclick="downloadFinal()">Download</button>
  <button onclick="closePopup()">Close</button>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const flash=document.getElementById("flash");
const countdown=document.getElementById("countdown");

let currentPhoto=null;
let currentFilter="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER FIX */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* FLASH FIX */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* COUNTDOWN FIX */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");

  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKERS */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  currentPhoto.appendChild(s);

  let drag=false,ox=0,oy=0;

  s.onmousedown=(e)=>{
    drag=true;
    ox=e.offsetX;
    oy=e.offsetY;
  };

  document.onmousemove=(e)=>{
    if(!drag) return;
    const box=currentPhoto.getBoundingClientRect();
    s.style.left=(e.clientX-box.left-ox)+"px";
    s.style.top=(e.clientY-box.top-oy)+"px";
  };

  document.onmouseup=()=>drag=false;
}

/* DONE */
function done(){
  const imgs=document.querySelectorAll(".photo img");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=800;
  c.height=1200;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  let y=50;

  imgs.forEach(img=>{
    ctx.drawImage(img,100,y,600,400);
    y+=420;
  });

  document.getElementById("finalImg").src=c.toDataURL();
  document.getElementById("popup").style.display="block";
}

function downloadFinal(){
  const a=document.createElement("a");
  a.href=document.getElementById("finalImg").src;
  a.download="meowcam.png";
  a.click();
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
