<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* MAIN LAYOUT */
.wrapper{
  display:flex;
  gap:20px;
}

/* CAMERA BOX */
.container{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

/* BG */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA */
#video{
  position:absolute;
  top:190px;
  left:40px;
  width:270px;
  height:270px;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:100px;
  height:100px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:280px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:50px;
  color:#ff2e6d;
  font-weight:bold;
  text-shadow:0 0 10px white;
  z-index:100;
}

/* FLASH */
.flash{
  position:absolute;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
}
.flash.active{
  animation:flash 0.3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* SIDE */
.side{
  text-align:center;
}

/* STRIP */
#strip{
  background:white;
  padding:15px;
  border-radius:20px;
  min-height:300px;
  width:200px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO */
.photo{
  position:relative;
  margin-bottom:10px;
}

.photo img{
  width:160px;
  border-radius:10px;
}

/* STICKER */
.sticker{
  position:absolute;
  width:50px;
  cursor:grab;
  touch-action:none;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:40px;
  cursor:pointer;
}

/* BUTTONS */
button{
  margin-top:10px;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}
.photo{
  position:relative;
  margin-bottom:10px;
}

.photo img{
  width:140px;
  border-radius:10px;
  display:block;
}

/* FIXED STICKER AREA */
.sticker{
  position:absolute;
  width:50px;
  cursor:grab;
  user-select:none;
  touch-action:none;
  z-index:10;
}

.popup-box{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  animation:pop 0.3s ease;
}

@keyframes pop{
  from{transform:scale(0.5);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

#preview img{
  width:180px;
  margin:5px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="done()">DONE ✔</button>
<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>💖 Your Strip is Ready!</h2>
    <div id="preview"></div>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,800));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,500));
  }
}

/* ADD STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const sticker=document.createElement("img");
  sticker.src=src;
  sticker.className="sticker";

  // start position inside photo
  sticker.style.left="40px";
  sticker.style.top="40px";

  enableDrag(sticker);
  currentPhoto.appendChild(sticker);
}

/* ✅ FIXED DRAG (WORKS MOUSE + MOBILE PROPERLY) */
function enableDrag(el){

  let offsetX=0, offsetY=0, dragging=false;

  el.addEventListener("mousedown",e=>{
    dragging=true;
    offsetX=e.offsetX;
    offsetY=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!dragging) return;

    const parent=el.parentElement.getBoundingClientRect();

    el.style.left=(e.clientX - parent.left - offsetX)+"px";
    el.style.top=(e.clientY - parent.top - offsetY)+"px";
  });

  document.addEventListener("mouseup",()=>dragging=false);

  /* MOBILE TOUCH */
  el.addEventListener("touchstart",e=>{
    dragging=true;
    const t=e.touches[0];
    offsetX=t.clientX - el.offsetLeft;
    offsetY=t.clientY - el.offsetTop;
  });

  document.addEventListener("touchmove",e=>{
    if(!dragging) return;

    const t=e.touches[0];
    const parent=el.parentElement.getBoundingClientRect();

    el.style.left=(t.clientX - parent.left - offsetX)+"px";
    el.style.top=(t.clientY - parent.top - offsetY)+"px";
  });

  document.addEventListener("touchend",()=>dragging=false);
}

/* DRAG FIX (MOUSE + TOUCH) */
function makeDrag(el){

  let x=0,y=0,drag=false;

  el.addEventListener("mousedown",e=>{
    drag=true;
    x=e.offsetX;
    y=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!drag) return;
    el.style.left=(e.pageX-x)+"px";
    el.style.top=(e.pageY-y)+"px";
  });

  document.addEventListener("mouseup",()=>drag=false);

  /* TOUCH */
  el.addEventListener("touchstart",e=>{
    drag=true;
    x=e.touches[0].clientX - el.offsetLeft;
    y=e.touches[0].clientY - el.offsetTop;
  });

  document.addEventListener("touchmove",e=>{
    if(!drag) return;
    el.style.left=(e.touches[0].clientX-x)+"px";
    el.style.top=(e.touches[0].clientY-y)+"px";
  });

  document.addEventListener("touchend",()=>drag=false);
}

/* DONE POPUP */
function done(){
  document.getElementById("preview").innerHTML=strip.innerHTML;
  document.getElementById("popup").style.display="flex";
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

/* DOWNLOAD FIX */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");
  if(!photos.length){
    alert("Take photos first!");
    return;
  }

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  const w=250;
  const h=180;

  c.width=w;
  c.height=photos.length*h;

  let y=0;

  photos.forEach(p=>{

    const img=p.querySelector("img");
    ctx.drawImage(img,20,y,200,150);

    y+=h;
  });

  const link=document.createElement("a");
  link.download="meowcam.png";
  link.href=c.toDataURL("image/png");

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

</script>

</body>
</html>
