<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.wrapper{
  display:flex;
  gap:15px;
}

/* CAMERA */
.container{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
}

/* YOUR CLICK BUTTON (UNCHANGED) */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* FILTERS (RESTORED) */
.filters{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:center;
  background:rgba(255,255,255,0.8);
  padding:5px;
  border-radius:10px;
}

/* SIDE */
.side{
  display:flex;
  gap:10px;
}

/* STRIP */
#strip{
  width:220px;
  min-height:250px;
  background:white;
  border-radius:15px;
  padding:10px;
}

/* PHOTO */
.photo{
  width:200px;
  margin:10px auto;
  position:relative;
}

/* STICKERS */
.sticker{
  position:absolute;
  width:60px;
  cursor:move;
}

/* PANEL */
.sticker-panel{
  width:90px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* PREVIEW POPUP */
.preview{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
}

.preview-box{
  background:white;
  padding:15px;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<!-- YOUR CLICK BUTTON -->
<button class="main-btn" onclick="startBooth()"></button>

<!-- FILTERS BACK -->
<div class="filters">
<button onclick="setFilter('none')">Normal</button>
<button onclick="setFilter('contrast(1.2)')">Bright</button>
<button onclick="setFilter('sepia(1)')">Vintage</button>
<button onclick="setFilter('grayscale(1)')">B&W</button>
<button onclick="setFilter('brightness(1.3)')">Glow</button>
</div>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
</div>

</div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">
  <div class="preview-box">
    <img id="finalImg" style="width:200px;"><br><br>
    <button onclick="downloadImg()">Download</button>
    <button onclick="closePreview()">Close</button>
  </div>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");

let currentPhoto=null;
let currentFilter="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    capture();
    await new Promise(r=>setTimeout(r,500));
  }
}

/* STICKER DRAG */
function addSticker(src){
  if(!currentPhoto) return;

  const img=document.createElement("img");
  img.src=src;
  img.className="sticker";
  img.style.left="40px";
  img.style.top="40px";

  currentPhoto.appendChild(img);

  let drag=false,ox,oy;

  img.onmousedown=e=>{
    drag=true;
    ox=e.offsetX;
    oy=e.offsetY;
  };

  document.onmousemove=e=>{
    if(!drag) return;
    const r=currentPhoto.getBoundingClientRect();
    img.style.left=(e.clientX-r.left-ox)+"px";
    img.style.top=(e.clientY-r.top-oy)+"px";
  };

  document.onmouseup=()=>drag=false;
}

/* DONE → PREVIEW */
function finishStrip(){

  const photos=document.querySelectorAll(".photo img");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=300;
  c.height=photos.length*300;

  photos.forEach((p,i)=>{
    ctx.drawImage(p,0,i*300,300,300);
  });

  const final=c.toDataURL();

  document.getElementById("finalImg").src=final;
  document.getElementById("preview").style.display="flex";

  window.finalImage=final;
}

/* DOWNLOAD */
function downloadImg(){
  const a=document.createElement("a");
  a.href=window.finalImage;
  a.download="meowcam.png";
  a.click();
}

/* CLOSE */
function closePreview(){
  document.getElementById("preview").style.display="none";
}

</script>

</body>
</html>
