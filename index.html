<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* WRAPPER */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:560px;   /* FIXED HEIGHT (NO CUTTING) */
  border-radius:20px;
  overflow:hidden;
}

/* BACKGROUND */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA VIDEO (CENTERED PROPERLY) */
#video{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  height:240px;
  border-radius:15px;
  object-fit:cover;
}

/* CLICK BUTTON FIX */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:85px;
  height:85px;
  border:none;
  border-radius:50%;
  background:#ff8fab;
  z-index:10;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:100;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* SIDE */
.side{
  text-align:center;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO */
.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
  display:block;
}

/* STICKER FIX */
.sticker{
  position:absolute;
  width:40px;
  z-index:999;
  touch-action:none;
  user-select:none;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
}

/* MOBILE FIX */
@media(max-width:768px){
  .wrapper{
    flex-direction:column;
    align-items:center;
  }

  .container{
    transform:scale(0.95);
  }

  #strip{
    width:260px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d");

  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="50px";
  s.style.top="50px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG FIX */
function drag(el){

  let dragging=false,ox=0,oy=0;

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start);

  function start(e){
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-el.offsetLeft;
    oy=p.clientY-el.offsetTop;
  }

  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});

  function move(e){
    if(!dragging) return;

    const p=e.touches?e.touches[0]:e;
    const box=el.parentElement.getBoundingClientRect();

    let x=p.clientX-box.left-ox;
    let y=p.clientY-box.top-oy;

    el.style.left=x+"px";
    el.style.top=y+"px";

    e.preventDefault();
  }

  document.addEventListener("mouseup",()=>dragging=false);
  document.addEventListener("touchend",()=>dragging=false);
}

/* DOWNLOAD */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=250;
  c.height=photos.length*180;

  let y=0;

  photos.forEach(p=>{
    const img=p.querySelector("img");
    ctx.drawImage(img,20,y,200,150);
    y+=180;
  });

  const a=document.createElement("a");
  a.download="meowcam.png";
  a.href=c.toDataURL();

  a.click();
}

</script>

</body>
</html>
