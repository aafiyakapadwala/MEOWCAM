<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
}

/* CAMERA BOX */
.camera-box{
  position:relative;
  width:100%;
  max-width:350px;
  height:600px;
  border-radius:20px;
  overflow:hidden;
}

/* BG VIDEO */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA */
#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) rotateY(180deg);
  width:85%;
  height:45%;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border:none;
  border-radius:50%;
  background:#ff4d88;
  z-index:50;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:1000;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  min-height:300px;
}

/* PHOTO */
.photo{
  position:relative;
  margin-bottom:10px;
}
.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKER */
.sticker{
  position:absolute;
  width:60px;
  z-index:999;
  touch-action:none;
  cursor:grab;
}

/* FILTERS */
.filters button{
  margin:3px;
}

/* STICKER PANEL */
.sticker-panel img{
  width:45px;
  cursor:pointer;
}

/* CREDIT */
.credit{
  font-size:12px;
  background:white;
  padding:6px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container-fluid py-3">
  <div class="row justify-content-center">

    <!-- CAMERA -->
    <div class="col-lg-4 col-md-6 col-12 d-flex justify-content-center mb-3">
      <div class="camera-box">

        <video class="bg-video" autoplay muted loop>
          <source src="billu.mp4">
        </video>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" class="d-none"></canvas>

        <div id="countdown"></div>
        <div class="flash" id="flash"></div>

        <button class="main-btn" onclick="startBooth()"></button>

      </div>
    </div>

    <!-- SIDE PANEL -->
    <div class="col-lg-4 col-md-6 col-12">

      <!-- STRIP -->
      <div id="strip" class="mb-3"></div>

      <!-- FILTERS -->
      <div class="filters text-center mb-3">
        <button class="btn btn-sm btn-danger" onclick="setFilter('none')">Normal</button>
        <button class="btn btn-sm btn-danger" onclick="setFilter('contrast(1.2)')">Bright</button>
        <button class="btn btn-sm btn-danger" onclick="setFilter('sepia(1)')">Vintage</button>
        <button class="btn btn-sm btn-danger" onclick="setFilter('grayscale(1)')">B&W</button>
        <button class="btn btn-sm btn-danger" onclick="setFilter('brightness(1.3)')">Glow</button>
      </div>

      <!-- STICKERS -->
      <div class="sticker-panel d-flex flex-wrap gap-2 justify-content-center mb-3">
        <img src="2.jpg" onclick="addSticker(this.src)">
        <img src="3.png" onclick="addSticker(this.src)">
        <img src="4.png" onclick="addSticker(this.src)">
        <img src="6.png" onclick="addSticker(this.src)">
        <img src="7.png" onclick="addSticker(this.src)">
        <img src="8.png" onclick="addSticker(this.src)">
      </div>

      <div class="credit text-center">
        By <b>Aafiya Kapadwala</b>
      </div>

    </div>

  </div>
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;
let currentFilter="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");

  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* ADD STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";
  s.style.left="30px";
  s.style.top="30px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG FIX */
function drag(el){
  let dragging=false, ox=0, oy=0;

  function pos(e){
    return e.touches ? e.touches[0] : e;
  }

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start);

  function start(e){
    dragging=true;
    const p=pos(e);
    ox=p.clientX - el.offsetLeft;
    oy=p.clientY - el.offsetTop;
    e.preventDefault();
  }

  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});

  function move(e){
    if(!dragging) return;

    const p=pos(e);
    const box=el.parentElement.getBoundingClientRect();

    el.style.left=(p.clientX - box.left - ox)+"px";
    el.style.top=(p.clientY - box.top - oy)+"px";

    e.preventDefault();
  }

  document.addEventListener("mouseup",()=>dragging=false);
  document.addEventListener("touchend",()=>dragging=false);
}
</script>

</body>
</html>
