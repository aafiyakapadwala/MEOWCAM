<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  flex-wrap:wrap;
}

/* WRAPPER */
.wrapper{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:320px;
  height:600px;
  border-radius:20px;
  overflow:hidden;
}

/* BACKGROUND */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAMERA */
#video{
  position:absolute;
  top:160px;
  left:25px;
  width:270px;
  height:270px;
  border-radius:15px;
  object-fit:cover;
}

/* BUTTON */
.main-btn{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:260px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  text-shadow:0 0 10px white;
  z-index:100;
}

/* FLASH */
.flash{
  position:absolute;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* SIDE */
.side{
  text-align:center;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  min-height:250px;
  width:200px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO */
.photo{
  position:relative;
  margin-bottom:10px;
  width:160px;
  height:150px;
  overflow:visible;
}

/* IMAGE */
.photo img{
  width:100%;
  height:100%;
  border-radius:10px;
  position:absolute;
  top:0;
  left:0;
  z-index:1;
}

/* STICKER */
.sticker{
  position:absolute;
  width:45px;
  touch-action:none;
  cursor:grab;
  z-index:9999;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:40px;
}

/* BUTTONS */
button{
  margin-top:10px;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:15px;
  border-radius:15px;
  text-align:center;
}

/* 📱 MOBILE FIX */
@media (max-width: 768px){

  body{
    flex-direction:column;
    padding:10px;
  }

  .wrapper{
    flex-direction:column;
    align-items:center;
  }

  .container{
    width:95vw;
    max-width:340px;
    height:520px;
  }

  #video{
    width:80%;
    height:260px;
    left:50%;
    transform:translateX(-50%);
    top:140px;
  }

  #countdown{
    font-size:38px;
  }

  .side{
    width:95vw;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  #strip{
    width:90%;
  }

  /* 🔥 BIG MOBILE BUTTONS */
  button{
    font-size:18px;
    padding:14px 18px;
    border-radius:14px;
    width:90%;
    max-width:260px;
  }

  .sticker-panel{
    width:90%;
  }

  .sticker-panel img{
    width:55px;
  }

  .main-btn{
    width:110px;
    height:110px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<button onclick="done()">DONE ✔</button>
<button onclick="downloadStrip()">DOWNLOAD 💾</button>

</div>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-box">
    <h2>💖 Your Strip is Ready</h2>
    <div id="preview"></div>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,500));
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG FIX */
function drag(el){

  let dx=0,dy=0,drag=false;

  el.addEventListener("mousedown",e=>{
    drag=true;
    dx=e.offsetX;
    dy=e.offsetY;
  });

  document.addEventListener("mousemove",e=>{
    if(!drag) return;

    const r=el.parentElement.getBoundingClientRect();

    el.style.left=(e.clientX-r.left-dx)+"px";
    el.style.top=(e.clientY-r.top-dy)+"px";
  });

  document.addEventListener("mouseup",()=>drag=false);

  /* MOBILE */
  el.addEventListener("touchstart",e=>{
    drag=true;
    const t=e.touches[0];
    dx=t.clientX - el.offsetLeft;
    dy=t.clientY - el.offsetTop;
  });

  document.addEventListener("touchmove",e=>{
    if(!drag) return;

    const t=e.touches[0];
    const r=el.parentElement.getBoundingClientRect();

    el.style.left=(t.clientX-r.left-dx)+"px";
    el.style.top=(t.clientY-r.top-dy)+"px";
  });

  document.addEventListener("touchend",()=>drag=false);
}

/* DONE */
function done(){
  document.getElementById("preview").innerHTML=strip.innerHTML;
  document.getElementById("popup").style.display="flex";

  setTimeout(()=>{
    strip.innerHTML="";
    currentPhoto=null;
  },500);
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

/* DOWNLOAD */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");
  if(!photos.length) return;

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=250;
  c.height=photos.length*180;

  let y=0;

  photos.forEach(p=>{
    const img=p.querySelector("img");
    ctx.drawImage(img,20,y,200,150);
    y+=180;
  });

  const link=document.createElement("a");
  link.download="meowcam.png";
  link.href=c.toDataURL("image/png");
  link.click();
}

</script>

</body>
</html>
