<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEOWCAM V2 🐱💖</title>

<style>
body{
  margin:0;
  font-family:"Comic Sans MS",cursive;
  background:linear-gradient(#ffd6e0,#fff0f5);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:auto;
}

/* WRAPPER */
.wrapper{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  justify-content:center;
}

/* CAMERA */
.container{
  position:relative;
  width:350px;
  height:700px;
  border-radius:20px;
  overflow:hidden;
}

/* BG */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}


/* CAMERA VIDEO (MIRRORED + FITTED) */
#video{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) rotateY(180deg);
  width:290px;
  height:295px;
  border-radius:15px;
  object-fit:cover;
}

/* CLICK BUTTON (YOUR ORIGINAL) */
.main-btn{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90px;
  height:90px;
  background:transparent;
  border:none;
  cursor:pointer;
  z-index:50;
}

/* COUNTDOWN */
#countdown{
  position:absolute;
  top:220px;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#ff2e6d;
  font-weight:bold;
  z-index:1000;
}

/* FLASH */
.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
}
.flash.active{
  animation:flash .3s;
}
@keyframes flash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* SIDE */
.side{
  text-align:center;
  max-height:90vh;
  overflow:auto;
}

/* STRIP */
#strip{
  background:white;
  padding:10px;
  border-radius:15px;
  width:220px;
  min-height:250px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PHOTO */
.photo{
  position:relative;
  width:200px;
  margin:10px auto;
}

.photo img{
  width:100%;
  border-radius:10px;
}

/* STICKER */
.sticker{
  position:absolute;
  width:55px;
  z-index:9999;
  touch-action:none;
  user-select:none;
}

/* PANEL */
.sticker-panel{
  margin-top:10px;
  background:white;
  padding:10px;
  border-radius:15px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  justify-content:center;
}

.sticker-panel img{
  width:35px;
  cursor:pointer;
}

/* FILTERS */

.filters{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  width:100%;
}
  .side{
  text-align:center;
  max-height:90vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
/* DOWNLOAD BUTTON */
button{
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#ff8fab;
  color:white;
  cursor:pointer;
}

/* FOOTER CREDIT */
.credit{
  margin-top:12px;
  font-size:12px;
  background:white;
  padding:8px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
  .camera-mask{
  position:absolute;
  inset:0;
  background-image:url("https://i.imgur.com/9XGQk3m.png"); /* cute frame overlay */
  background-size:cover;
  background-position:center;
  pointer-events:none;
  z-index:999;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CAMERA -->
<div class="container">

<video class="bg-video" autoplay muted loop>
<source src="billu.mp4">
</video>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="countdown"></div>
<div class="flash" id="flash"></div>

<button class="main-btn" onclick="startBooth()"></button>

</div>
  <div class="camera-mask"></div>

<!-- SIDE -->
<div class="side">

<div id="strip"></div>

<div class="sticker-panel">
<img src="2.jpg" onclick="addSticker(this.src)">
<img src="3.png" onclick="addSticker(this.src)">
<img src="4.png" onclick="addSticker(this.src)">
<img src="6.png" onclick="addSticker(this.src)">
<img src="7.png" onclick="addSticker(this.src)">
<img src="8.png" onclick="addSticker(this.src)">
</div>

<!-- FILTERS -->
<div class="filters">
<button onclick="setFilter('none')">Normal</button>
<button onclick="setFilter('contrast(1.2)')">Bright</button>
<button onclick="setFilter('sepia(1)')">Vintage</button>
<button onclick="setFilter('grayscale(1)')">B&W</button>
<button onclick="setFilter('brightness(1.3)')">Glow</button>
</div>

<button onclick="downloadStrip()">DOWNLOAD 💾</button>

<!-- CREDIT BOX -->
<div class="credit">
By <b>Aafiya Kapadwala</b><br>
</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const strip=document.getElementById("strip");
const countdown=document.getElementById("countdown");
const flash=document.getElementById("flash");

let currentPhoto=null;
let currentFilter="none";

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:true})
.then(s=>video.srcObject=s);

/* FILTER */
function setFilter(f){
  currentFilter=f;
  video.style.filter=f;
}

/* TIMER */
async function timer(){
  const steps=["Ready...","Set...","Paws 🐾"];
  for(let t of steps){
    countdown.innerText=t;
    await new Promise(r=>setTimeout(r,700));
  }
  countdown.innerText="";
}

/* FLASH */
function flashEffect(){
  flash.classList.add("active");
  setTimeout(()=>flash.classList.remove("active"),300);
}

/* CAPTURE */
function capture(){
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d");

  ctx.filter=currentFilter;
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1); // mirror save too
  ctx.drawImage(video,0,0);

  flashEffect();

  const div=document.createElement("div");
  div.className="photo";

  const img=document.createElement("img");
  img.src=canvas.toDataURL();

  div.appendChild(img);
  strip.appendChild(div);

  currentPhoto=div;
}

/* BOOTH */
async function startBooth(){
  strip.innerHTML="";
  for(let i=0;i<3;i++){
    await timer();
    capture();
    await new Promise(r=>setTimeout(r,400));
  }
}

/* STICKER */
function addSticker(src){
  if(!currentPhoto) return;

  const s=document.createElement("img");
  s.src=src;
  s.className="sticker";

  s.style.left="40px";
  s.style.top="40px";

  drag(s);
  currentPhoto.appendChild(s);
}

/* DRAG */
function drag(el){

  let dragging=false,ox=0,oy=0;

  const start=(e)=>{
    dragging=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-el.offsetLeft;
    oy=p.clientY-el.offsetTop;
  };

  const move=(e)=>{
    if(!dragging) return;

    const p=e.touches?e.touches[0]:e;
    const box=el.parentElement.getBoundingClientRect();

    el.style.left=(p.clientX-box.left-ox)+"px";
    el.style.top=(p.clientY-box.top-oy)+"px";

    e.preventDefault();
  };

  const end=()=>dragging=false;

  el.addEventListener("mousedown",start);
  el.addEventListener("touchstart",start);

  document.addEventListener("mousemove",move);
  document.addEventListener("touchmove",move,{passive:false});

  document.addEventListener("mouseup",end);
  document.addEventListener("touchend",end);
}

/* DOWNLOAD */
function downloadStrip(){

  const photos=document.querySelectorAll(".photo");

  const c=document.createElement("canvas");
  const ctx=c.getContext("2d");

  c.width=1080;
  c.height=1920;

  ctx.fillStyle="white";
  ctx.fillRect(0,0,c.width,c.height);

  let y=100;

  photos.forEach(p=>{
    const img=p.querySelector("img");
    ctx.drawImage(img,300,y,480,360);
    y+=400;
  });

  const a=document.createElement("a");
  a.download="meowcam.png";
  a.href=c.toDataURL("image/png");

  a.click();
}

</script>

</body>
</html>
